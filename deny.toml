[advisories]
db-path = "~/.cargo/advisory-db"
ignore = [
    # RUSTSEC-2025-0119 (number_prefix unmaintained): transitive dep via
    # indicatif's chart formatting. Upstream pull-request pending; not a
    # security vulnerability, just a maintenance signal.
    "RUSTSEC-2025-0119",
    # RUSTSEC-2023-0071 (rsa timing-side-channel): pulled in transitively
    # by russh -> ssh-key -> rsa. The affected rsa release is a
    # pre-release (0.10.0-rc.18) with no fixed version published, so the
    # advisory can only be cleared by an upstream russh/ssh-key bump.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "MIT-0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
